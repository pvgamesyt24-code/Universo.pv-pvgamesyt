<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo PV</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #1e293b;
            padding: 2rem;
            border-bottom: 2px solid #3b82f6;
        }
        h1 {
            color: #60a5fa;
            margin: 0;
        }
        main {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e293b;
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>Universo PV</h1>
        <p>Bem-vindo ao site oficial!</p>
    </header>

    <main>
        <div class="card">
            <h2>Sobre o Projeto</h2>
            <p>Este é o novo portal do Universo PV. Em breve, novos conteúdos, vídeos e novidades aqui!</p>
        </div>
    </main>

</body>
</html>
